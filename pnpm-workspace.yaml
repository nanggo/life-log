packages: []

# NOTE: keep overrides in sync with the "pnpm.overrides" field in package.json.
# Vercel builds with pnpm 9, which only reads package.json; GitHub CI uses the
# latest pnpm, which only reads this file. Both must define the same set or
# frozen installs fail with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
overrides:
  lodash: 4.18.1
  rollup: 4.60.3
  tar: 7.5.21
  'ajv@<6.14.0': 6.14.0
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=3.0.0 <5.0.9': 5.0.9
  'cookie@<0.7.0': 0.7.2
  'flatted@<3.4.2': 3.4.2
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'js-yaml@<3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'minimatch@<3.1.4': 3.1.4
  'minimatch@>=9.0.0 <9.0.7': 9.0.7
  'minimatch@>=10.0.0 <10.2.3': 10.2.3
  'nanoid@<3.3.18': 3.3.18
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'postcss@<=8.5.22': 8.5.23
  'svgo@>=2.1.0 <2.8.3': 2.8.3
  'ws@>=8.0.0 <8.21.1': 8.21.1
  'yaml@<1.10.3': 1.10.3
  'yaml@>=2.0.0 <2.8.3': 2.8.3

allowBuilds:
  '@vercel/speed-insights': true
  esbuild: true
  sharp: true
  svelte-preprocess: true
  unrs-resolver: true
